name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only the svg render is used. The gif render was measured at 429 frames of
      # 880x206, and a browser keeps every decoded frame, so it held about
      # 300 MB for as long as the tab lived; the README collapses the svg
      # instead, which costs nothing while the section stays closed.
      - uses: Platane/snk@v3
        with:
          github_user_name: pachir1su
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#f1eefb,#c4b5fd,#a78bfa,#7c3aed,#5b21b6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
