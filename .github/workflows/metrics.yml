name: Metrics
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
 
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pachir1su
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul
          # The repositories query carries languages, releases and issue/pull
          # request counts for every repository it returns. Asking for 100 at
          # once made GitHub's GraphQL API time out on some runs, and metrics
          # silently kept zero repositories when that happened, which rendered
          # the card with "0 Languages" and "0 Stargazers".
          repositories_batch: 10
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: jupyter notebook
          plugin_languages_threshold: 0%
          plugin_habits: yes
          # Charts only. The facts list renders prose lines such as "Uses
          # spaces for indentation" and "Mostly active on Tuesday", and this
          # card is meant to stay figures and graphs.
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user

 
